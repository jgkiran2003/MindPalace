[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "palace"
version = "0.1.0"
description = "Local-first Markdown ingestion and hybrid retrieval for MindPalace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "flashrank>=0.2",
    "httpx>=0.27",
    "lancedb>=0.25",
    "pyarrow>=15",
    "pydantic>=2.6",
    "pyyaml>=6",
    "requests>=2.31",
    "rerankers[flashrank]>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
palace = "palace.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

